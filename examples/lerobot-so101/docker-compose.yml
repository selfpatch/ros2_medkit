# Run from examples/lerobot-so101/:  docker compose up --build
services:
  # Simulation + LeRobot policy + episode runner + ros2_medkit, one ROS 2 graph
  lerobot-so101:
    build:
      context: ../..
      dockerfile: examples/lerobot-so101/Dockerfile
    container_name: ${EXAMPLE_CONTAINER:-lerobot_so101_example}
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-42}
      - POLICY_REPO=${POLICY_REPO:-local}
      # The example gateway runs without authentication (config/gateway.yaml), so
      # its port is published on this machine only; this says the lack of auth is
      # on purpose.
      - MEDKIT_AUTH_DISABLED=1
      # 3 s DDS liveliness lease, so a killed process leaves the graph quickly (see the file)
      - FASTRTPS_DEFAULT_PROFILES_FILE=/opt/example_ws/install/lerobot_so101_example/share/lerobot_so101_example/config/fastdds.xml
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8080}:8080"
    volumes:
      # The trained ACT checkpoint (see README: train it, or download it)
      - ${POLICY_DIR:-./policy}:/opt/policy:ro
      - ./results:/data/results
      # Fault database and recordings survive a restart
      - medkit-data:/var/lib/ros2_medkit
    # ros2 launch shuts its nodes down cleanly on SIGINT, not on SIGTERM
    stop_signal: SIGINT
    tty: true
    command: >
      bash -c "mkdir -p /var/lib/ros2_medkit/rosbags &&
               source /opt/example_ws/install/setup.bash &&
               exec ros2 launch lerobot_so101_example example.launch.py"

  # Web UI for browsing entities and faults (optional): docker compose --profile ui up
  medkit-web-ui:
    image: ghcr.io/selfpatch/ros2_medkit_web_ui:latest
    container_name: ${WEB_UI_CONTAINER:-lerobot_so101_web_ui}
    ports:
      - "127.0.0.1:${WEB_UI_PORT:-3000}:80"
    depends_on:
      - lerobot-so101
    profiles: ["ui"]

volumes:
  medkit-data:
