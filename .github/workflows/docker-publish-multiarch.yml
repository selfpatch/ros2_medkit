# Multi-arch (linux/amd64 + linux/arm64) image publish for the gateway.
#
# Gated on release tags and manual dispatch only - NOT on pull_request or
# push-to-main. Per-PR / push-to-main CI still runs the amd64-only
# docker-publish.yml, which stays fast (no emulated arm64 on every change).
#
# Each arch builds on its own NATIVE runner (arm64 on ubuntu-24.04-arm), so
# there is no QEMU emulation. Each arch is pushed by digest, then the merge
# job stitches the per-arch digests of a given ROS distro into one multi-arch
# manifest list and tags it. Mirrors the ros2_medkit_web_ui docker-publish.yml
# pattern, extended with the ros_distro build-arg dimension.

name: Docker Publish (multi-arch, release)

on:
    push:
        tags:
            # Release tags are bare semver; only the first release carried a
            # `v`. Both shapes match, and neither matches the bloom
            # `release/...` and `debian/...` tags, which start with a letter.
            - '[0-9]*.[0-9]*.[0-9]*'
            - 'v[0-9]*.[0-9]*.[0-9]*'
    workflow_dispatch:

env:
    REGISTRY: ghcr.io

jobs:
    build:
        runs-on: ${{ matrix.runner }}
        permissions:
            contents: read
            packages: write
        strategy:
            fail-fast: false
            matrix:
                ros_distro: [jazzy, humble, lyrical]
                platform:
                    - linux/amd64
                    - linux/arm64
                # `include` merges the runner key into every matrix combination
                # whose platform matches - amd64 -> ubuntu-24.04, arm64 ->
                # ubuntu-24.04-arm (native arm runner, free for public repos).
                include:
                    - platform: linux/amd64
                      runner: ubuntu-24.04
                    - platform: linux/arm64
                      runner: ubuntu-24.04-arm

        steps:
            - name: Prepare platform pair
              run: |
                  platform=${{ matrix.platform }}
                  echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Extract metadata (labels)
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/ros2_medkit-${{ matrix.ros_distro }}

            - name: Build and push by digest
              id: build
              uses: docker/build-push-action@v6
              with:
                  context: .
                  platforms: ${{ matrix.platform }}
                  build-args: ROS_DISTRO=${{ matrix.ros_distro }}
                  labels: ${{ steps.meta.outputs.labels }}
                  # Separate cache scope per distro+arch so jobs do not evict each other.
                  cache-from: type=gha,scope=${{ matrix.ros_distro }}-${{ env.PLATFORM_PAIR }}
                  cache-to: type=gha,mode=max,scope=${{ matrix.ros_distro }}-${{ env.PLATFORM_PAIR }}
                  # Push each arch by digest; the merge job creates and tags the manifest list.
                  outputs: type=image,name=${{ env.REGISTRY }}/${{ github.repository_owner }}/ros2_medkit-${{ matrix.ros_distro }},push-by-digest=true,name-canonical=true,push=true

            # The artifact inspected here is the digest the step above pushed,
            # which is the one the merge job stitches into the manifest list and
            # tags: it is pulled back from the registry by that digest, so no
            # cache hit or rebuild sits between what is checked and what is
            # published. The OPC-UA plugin the image carries must have no
            # controller write path, and the symbol table of the .so inside it
            # is what settles that.
            #
            # The merge job needs this one, so a digest that fails here never
            # reaches a tag. It does stay in the registry as an untagged blob,
            # reachable only by a digest nothing publishes.
            - name: Inspect the plugin object in the pushed image
              run: |
                  set -euo pipefail
                  img=${{ env.REGISTRY }}/${{ github.repository_owner }}/ros2_medkit-${{ matrix.ros_distro }}@${{ steps.build.outputs.digest }}
                  docker pull "$img"
                  so=$(docker run --rm --entrypoint sh "$img" -c \
                    'find /home/medkit/ws/install -name libros2_medkit_opcua_plugin.so | head -1')
                  [ -n "$so" ] || { echo "no OPC-UA plugin object in $img" >&2; exit 1; }
                  cid=$(docker create "$img")
                  docker cp "$cid:$so" "$RUNNER_TEMP/plugin-from-image.so"
                  docker rm -v "$cid" >/dev/null
                  python3 src/ros2_medkit_plugins/ros2_medkit_opcua/test/inspect_build_variant.py \
                    "$RUNNER_TEMP/plugin-from-image.so" --expect read-only
                  rm -f "$RUNNER_TEMP/plugin-from-image.so"

            - name: Export digest
              run: |
                  mkdir -p /tmp/digests
                  digest="${{ steps.build.outputs.digest }}"
                  touch "/tmp/digests/${digest#sha256:}"

            - name: Upload digest
              uses: actions/upload-artifact@v4
              with:
                  name: digests-${{ matrix.ros_distro }}-${{ env.PLATFORM_PAIR }}
                  path: /tmp/digests/*
                  if-no-files-found: error
                  retention-days: 1

    # Merge the per-arch digests of each ROS distro into one multi-arch manifest
    # list and tag it. One merge job per distro (matrix), each pulling only its
    # own digests-<distro>-* artifacts.
    merge:
        runs-on: ubuntu-latest
        needs:
            - build
        permissions:
            contents: read
            packages: write
        strategy:
            fail-fast: false
            matrix:
                ros_distro: [jazzy, humble, lyrical]
        steps:
            - name: Download digests
              uses: actions/download-artifact@v4
              with:
                  path: /tmp/digests
                  pattern: digests-${{ matrix.ros_distro }}-*
                  merge-multiple: true

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Extract metadata (tags, labels)
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/ros2_medkit-${{ matrix.ros_distro }}
                  # `latest` belongs to docker-publish.yml, which moves it on
                  # every push to main; without this the action's default
                  # `latest=auto` would have a release take that tag over.
                  flavor: latest=false
                  tags: |
                      # version tag (0.7.0 -> 0.7.0)
                      type=semver,pattern={{version}}
                      # major.minor (0.7.0 -> 0.7)
                      type=semver,pattern={{major}}.{{minor}}
                      # sha for traceability
                      type=sha,prefix=sha-,format=short

            - name: Create multi-arch manifest list
              working-directory: /tmp/digests
              run: |
                  docker buildx imagetools create \
                    $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
                    $(printf '${{ env.REGISTRY }}/${{ github.repository_owner }}/ros2_medkit-${{ matrix.ros_distro }}@sha256:%s ' *)

            - name: Inspect manifest
              run: |
                  docker buildx imagetools inspect \
                    ${{ env.REGISTRY }}/${{ github.repository_owner }}/ros2_medkit-${{ matrix.ros_distro }}:${{ steps.meta.outputs.version }}
