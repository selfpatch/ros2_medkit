# SOVD System Manifest: several reporters of one fault code
# =========================================================
# Hybrid-mode manifest with three external apps hosted by one component in one
# area. They report the same fault_code to the fault_manager under their own
# entity ids. With that code configured per_source, each is a record of its own
# inside the component's and the area's fault scope.
#
# owner-a2 extends owner-a's id, so a prefix match would hand it owner-a's
# sub-sources (owner-a/x). It owns none of them.
#
# The apps are external: they report under their bare entity ids rather than a
# ROS FQN, which is also how a non-ROS asset bridged in by a protocol plugin
# reports.
#
# Used by: test/features/test_faults_owner_identity.test.py,
# test_faults_entity_clear_failure.test.py, test_rosbag_owner_download.test.py

manifest_version: "1.0"

metadata:
  name: "fault-owner-identity"
  version: "1.0.0"
  description: "Two external apps under one component sharing a fault code"

config:
  unmanifested_nodes: warn
  inherit_runtime_resources: true

areas:
  - id: shared-code-cell
    name: "Shared Code Cell"
    namespace: /shared_code_cell
    description: "Cell hosting two assets that report the same fault code"

components:
  - id: shared-code-hub
    name: "Shared Code Hub"
    type: "controller"
    area: shared-code-cell
    description: "Hosts every reporting asset, so every record lands in one scope"

apps:
  - id: owner-a
    name: "Owner A"
    external: true
    is_located_on: shared-code-hub
    description: "Reports SHARED_CODE under its own entity id"

  - id: owner-b
    name: "Owner B"
    external: true
    is_located_on: shared-code-hub
    description: "Reports the same SHARED_CODE under its own entity id"

  - id: owner-a2
    name: "Owner A2"
    external: true
    is_located_on: shared-code-hub
    description: "Its id extends owner-a's; it owns none of owner-a's sources"
