# ROS 2 Medkit Gateway - secure field profile
#
# Hardened parameter preset for on-prem / plant-network (appliance)
# deployments. It turns ON every control that the default development config
# leaves OFF: JWT auth, TLS, restricted CORS, and rate limiting. Use this file
# instead of gateway_params.yaml for any deployment reachable from an
# untrusted network.
#
# Secrets come from the environment, never from a launch argument:
#
#   export MEDKIT_JWT_SECRET=<at least 32 characters>
#   export MEDKIT_CLIENTS="<id>:<secret>:<role>[,<id>:<secret>:<role>...]"
#   ros2 run ros2_medkit_gateway gateway_node \
#     --ros-args --params-file gateway_params.secure.yaml
#
# The certificate and key named under server.tls must exist before start.
# See design/hardening.rst for the full checklist.

ros2_medkit_gateway:
  ros__parameters:
    server:
      # Appliance binds all interfaces; TLS + auth below protect the surface.
      # Narrow to a management interface IP when the deployment allows it.
      host: "0.0.0.0"
      port: 8443

      # TLS/HTTPS - REQUIRED. The gateway does not start if the certificate or
      # key cannot be read. The key must be readable by the gateway user only
      # (chmod 600). scripts/generate_dev_certs.sh makes a dev-only pair.
      tls:
        enabled: true
        cert_file: "/etc/ros2_medkit/certs/cert.pem"   # REQUIRED
        key_file: "/etc/ros2_medkit/certs/key.pem"     # REQUIRED (chmod 600)
        # CA bundle for client certificates; required by require_client_cert.
        ca_file: ""
        # Mutual TLS: needs ca_file. Clients still need a token.
        # require_client_cert: true
        # 1.3 preferred on a controlled fleet; drop to 1.2 only for legacy
        # clients that cannot negotiate 1.3.
        min_version: "1.3"

    # CORS - restrict to the explicit origins that serve the operator UI.
    # Never use ["*"] with credentials. [""] disables CORS entirely
    # (correct for API-only appliances with no browser UI).
    cors:
      allowed_origins: ["https://medkit-ui.local"]  # REQUIRED if a browser UI is used; else [""]
      allowed_methods: ["GET", "PUT", "POST", "DELETE", "OPTIONS"]
      allowed_headers: ["Content-Type", "Accept", "Authorization"]
      allow_credentials: true
      max_age_seconds: 600

    # Authentication (JWT + RBAC) - REQUIRED on.
    auth:
      enabled: true
      # Supply the secret as MEDKIT_JWT_SECRET (>= 32 chars). It wins over this
      # key. A value written here sits in this file in clear text.
      jwt_secret: ""            # REQUIRED
      jwt_public_key: ""
      jwt_algorithm: "HS256"
      token_expiry_seconds: 3600
      refresh_token_expiry_seconds: 86400
      # Routes answered without a token, as "METHOD /path". Empty keeps every
      # route closed. Liveness probe: public_routes: ["GET /api/v1/health"]
      public_routes: [""]
      # "all" needs a token on every route except /api/v1/auth/*, where clients
      # log in. Use "write" only when anonymous reads are acceptable here.
      require_auth_for: "all"
      issuer: "ros2_medkit_gateway"
      # Supply the clients as MEDKIT_CLIENTS, "id:secret:role" separated by
      # commas (roles: viewer/operator/configurator/admin). With the secret set
      # it replaces this list. Entries written here sit in the file in clear text.
      clients: [""]            # REQUIRED

    # Rate limiting - ON to bound abuse / runaway clients.
    rate_limiting:
      enabled: true
      global_requests_per_minute: 600
      client_requests_per_minute: 120
      # Operation start (POST .../executions) and the execution list (GET
      # .../executions) share one bucket. The limiter does not see the method,
      # so status polls and cancels (.../executions/{id}) stay under the client limit.
      endpoint_limits: ["/api/v1/*/*/operations/*/executions:30"]
      client_cleanup_interval_seconds: 300
      client_max_idle_seconds: 600

    # Diagnostic scripts - disabled by default on an appliance. Enable
    # deliberately and keep uploads off (manifest-defined scripts only).
    scripts:
      scripts_dir: ""
      allow_uploads: false
      max_file_size_mb: 10
      max_concurrent_executions: 5
      default_timeout_sec: 300
      max_execution_history: 100

    # Bulk data uploads - cap the payload size; raise only if the deployment
    # genuinely needs large uploads.
    bulk_data:
      storage_dir: "/var/lib/ros2_medkit/bulk_data"
      max_upload_size: 26214400  # 25 MiB
      categories: [""]

    # SOVD resource locking on: component and app operations need a lock, so
    # concurrent operators cannot stamp on each other's calls.
    locking:
      enabled: true
      default_max_expiration: 3600
      cleanup_interval: 30
      defaults:
        components:
          lock_required_scopes: ["operations"]
          breakable: true
        apps:
          lock_required_scopes: ["operations"]
          breakable: true

    # OpenAPI /docs endpoints off on a hardened appliance (reduce surface).
    docs:
      enabled: false

    # Peer aggregation: if used across hosts, require TLS and do NOT forward
    # client tokens to mDNS-discovered peers unless every peer is trusted.
    aggregation:
      enabled: false
      require_tls: true
      forward_auth: false
      # This gateway's own credential for peer connections. Prefer it over
      # forward_auth where peers authenticate: it never carries an end user's
      # token, and it is not sent to mDNS-discovered peers at all.
      peer_auth_header: ""
      peer_scheme: "https"
