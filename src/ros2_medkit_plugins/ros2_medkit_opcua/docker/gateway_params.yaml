# DEMO ONLY - wide open (no auth, no TLS, CORS "*"). For appliance / plant
# deployments use /config/gateway_params.secure.yaml instead (auth + TLS +
# restricted CORS + rate limiting). See ros2_medkit_gateway design/hardening.rst.
ros2_medkit_gateway:
  ros__parameters:
    server:
      host: "0.0.0.0"
      port: 8080
      # DEMO ONLY - the demo has no authentication, so binding 0.0.0.0 needs the opt-out.
      allow_unauthenticated_remote: true
    refresh_interval_ms: 2000
    cors:
      # DEMO ONLY - restrict origins in production deployments
      allowed_origins: ["*"]
    plugins: ["opcua"]
    plugins.opcua.poll_interval_ms: 1000
    # The PLC entities' freeze-frames, next to faults.db. scripts/start.sh mounts a
    # named volume at /var/lib/ros2_medkit, so a frame outlives stop.sh.
    entity_freeze_frame:
      storage:
        path: "/var/lib/ros2_medkit/entity_freeze_frames.db"
