diagnostic_bridge:
  ros__parameters:
    # Topic to subscribe to
    diagnostics_topic: "/diagnostics"

    # Auto-generate fault codes from diagnostic names
    # If false, only explicitly mapped diagnostics will be forwarded
    auto_generate_codes: true

    # Use slash-containing diagnostic hardware_id values as fault source IDs.
    # Disabled by default because hardware_id is often a serial number or device path.
    use_hardware_id_as_source_id: false

    # Maximum number of per-source FaultReporter instances retained by the bridge.
    max_tracked_sources: 512

    # Severity a STALE status reports at. STALE is the one level a node can reach by
    # design - a GPS in every tunnel, an IMU reporting covariance -1 - and CRITICAL
    # bypasses debounce, so leaving it CRITICAL confirms a fault on the first sample.
    # One of INFO, WARN, ERROR, CRITICAL.
    stale_severity: "CRITICAL"

    # Per-diagnostic STALE severity. Matches on the start of the diagnostic name, so a
    # component prefix covers every check it publishes. Longest matching prefix wins.
    # Format: "stale_severity_overrides.<diagnostic name or prefix>": "<SEVERITY>"
    # Example:
    # "stale_severity_overrides.gps": "WARN"
    # "stale_severity_overrides.gps: antenna": "ERROR"

    # Custom diagnostic name to fault code mappings
    # Format: "name_to_code.<diagnostic_name>": "<FAULT_CODE>"
    # Example:
    # "name_to_code.motor_controller: Temperature": "MOTOR_OVERHEAT"
    # "name_to_code.battery_monitor: Voltage": "BATTERY_LOW"
